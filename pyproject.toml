[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-audit"
version = "0.1.0"
description = "Atrybucja i audyt kosztów transportu (MyBed / Delta Industries)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "RapidFuzz>=3.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "XlsxWriter>=3.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0"]
supabase = ["supabase>=2.0"]

[project.scripts]
transport-audit = "transport_audit.cli:app"

[tool.setuptools.packages.find]
include = ["transport_audit*"]

[tool.pytest.ini_options]
testpaths = ["transport_audit/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
